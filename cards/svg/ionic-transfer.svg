<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Ionic bond: electron handover</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">Mg + 2Cl → MgCl2</text>
  <rect x="60" y="140" width="200" height="110" rx="12" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="160" y="175" font-family="sans-serif" font-size="17" font-weight="700" fill="#3d3833" text-anchor="middle">Mg (2,8,2)</text><text x="160" y="205" font-family="sans-serif" font-size="14" font-weight="600" fill="#8b8178" text-anchor="middle">2 electrons DETA hai</text><text x="160" y="228" font-family="sans-serif" font-size="15" font-weight="700" fill="#b8503c" text-anchor="middle">→ Mg2+ (2,8)</text><rect x="540" y="140" width="200" height="110" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="640" y="175" font-family="sans-serif" font-size="17" font-weight="700" fill="#3d3833" text-anchor="middle">2 x Cl (2,8,7)</text><text x="640" y="205" font-family="sans-serif" font-size="14" font-weight="600" fill="#8b8178" text-anchor="middle">1 electron each LETE hain</text><text x="640" y="228" font-family="sans-serif" font-size="15" font-weight="700" fill="#6f9272" text-anchor="middle">→ 2Cl- (2,8,8)</text><line x1="260" y1="180" x2="526" y2="180" stroke="#b8503c" stroke-width="3"/>
  <polygon points="540,180 526,187 526,173" fill="#b8503c"/><text x="400" y="165" font-family="sans-serif" font-size="14" font-weight="700" fill="#c08a2d" text-anchor="middle">electron transfer</text><rect x="280" y="290" width="240" height="70" rx="12" fill="#fdf3e3" stroke="#c08a2d" stroke-width="2"/><text x="400" y="320" font-family="sans-serif" font-size="22" font-weight="700" fill="#3d3833" text-anchor="middle">MgCl2</text><text x="400" y="345" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">(ionic / electrovalent compound)</text><text x="400" y="410" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">Opposite charges ka strong attraction = high melting point</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.3 · Red Pen</text>
</svg>