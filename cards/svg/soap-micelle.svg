<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Soap micelle &amp; hard water</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">ek end paani-pyar, ek end oil-pyar</text>
  <rect x="60" y="130" width="320" height="130" rx="12" fill="#eef1f6" stroke="#7d94b5" stroke-width="2"/><text x="220" y="160" font-family="sans-serif" font-size="15" font-weight="700" fill="#7d94b5" text-anchor="middle">SOAP MOLECULE</text><text x="220" y="190" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">ionic end: HYDROPHILIC</text><text x="220" y="212" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="middle">(paani mein ghulta)</text><text x="220" y="238" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">tail: HYDROPHOBIC (oil mein)</text><rect x="420" y="130" width="320" height="130" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="580" y="160" font-family="sans-serif" font-size="15" font-weight="700" fill="#6f9272" text-anchor="middle">MICELLE</text><text x="580" y="190" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">tails andar → oil/dirt pakdo</text><text x="580" y="212" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">ionic ends bahar → paani mein</text><text x="580" y="238" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">dirt rinse ho jaata hai</text><rect x="60" y="300" width="320" height="120" rx="12" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="220" y="330" font-family="sans-serif" font-size="15" font-weight="700" fill="#b8503c" text-anchor="middle">HARD WATER + SOAP</text><text x="220" y="358" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">Ca/Mg ions → SCUM</text><text x="220" y="380" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="middle">(insoluble, foam kam)</text><text x="220" y="402" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">soap waste hota hai</text><rect x="420" y="300" width="320" height="120" rx="12" fill="#fff" stroke="#6f9272" stroke-width="2"/><text x="580" y="330" font-family="sans-serif" font-size="15" font-weight="700" fill="#6f9272" text-anchor="middle">HARD WATER + DETERGENT</text><text x="580" y="358" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">sulphonic acid salts</text><text x="580" y="380" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">Ca/Mg se precipitate NAHI</text><text x="580" y="402" font-family="sans-serif" font-size="14" font-weight="700" fill="#6f9272" text-anchor="middle">= effective! (shampoos)</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.4 · Red Pen</text>
</svg>