<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Rusting of iron</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">corrosion ka sabse famous case</text>
  <rect x="40" y="120" width="720" height="80" rx="12" fill="#fff" stroke="#e9dfd0" stroke-width="2"/><text x="60" y="152" font-family="sans-serif" font-size="18" font-weight="600" fill="#3d3833" text-anchor="start">iron + oxygen + water (moisture)</text><line x1="430" y1="145" x2="486" y2="145" stroke="#b8503c" stroke-width="3"/>
  <polygon points="500,145 486,152 486,138" fill="#b8503c"/><text x="510" y="152" font-family="sans-serif" font-size="18" font-weight="700" fill="#b8503c" text-anchor="start">Fe2O3·xH2O (rust)</text><text x="60" y="182" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="start">brown flaky layer - metal weak hota jata hai</text><text x="60" y="240" font-family="sans-serif" font-size="18" font-weight="700" fill="#3d3833" text-anchor="start">Rokne ke 4 tareeke:</text><rect x="40" y="258" width="340" height="70" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="60" y="288" font-family="sans-serif" font-size="16" font-weight="600" fill="#3d3833" text-anchor="start">1. Painting / oiling</text><text x="60" y="312" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="start">surface band - hawa-paani bahar</text><rect x="420" y="258" width="340" height="70" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="440" y="288" font-family="sans-serif" font-size="16" font-weight="600" fill="#3d3833" text-anchor="start">2. Galvanisation</text><text x="440" y="312" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="start">zinc coating (zinc pehle react karta hai)</text><rect x="40" y="345" width="340" height="70" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="60" y="375" font-family="sans-serif" font-size="16" font-weight="600" fill="#3d3833" text-anchor="start">3. Alloying</text><text x="60" y="399" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="start">stainless steel = iron + chromium</text><rect x="420" y="345" width="340" height="70" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="440" y="375" font-family="sans-serif" font-size="16" font-weight="600" fill="#3d3833" text-anchor="start">4. Greasing</text><text x="440" y="399" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="start">cycle chain pe grease, same logic</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.1 · Red Pen</text>
</svg>