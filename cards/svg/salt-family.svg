<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Common salt ki family</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">ek NaCl se itne saare chemicals</text>
  <rect x="280" y="115" width="240" height="62" rx="12" fill="#fdf3e3" stroke="#c08a2d" stroke-width="2"/><text x="400" y="145" font-family="sans-serif" font-size="17" font-weight="700" fill="#3d3833" text-anchor="middle">Common salt (NaCl)</text><text x="400" y="168" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">+ paani = brine</text><rect x="40" y="225" width="220" height="120" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="150" y="255" font-family="sans-serif" font-size="15" font-weight="700" fill="#6f9272" text-anchor="middle">NaOH (caustic soda)</text><text x="150" y="280" font-family="sans-serif" font-size="13" font-weight="600" fill="#3d3833" text-anchor="middle">chlor-alkali:</text><text x="150" y="300" font-family="sans-serif" font-size="13" font-weight="600" fill="#3d3833" text-anchor="middle">brine + electricity</text><text x="150" y="325" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="middle">Cl2 anode · H2 cathode</text><rect x="290" y="225" width="220" height="120" rx="12" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="400" y="255" font-family="sans-serif" font-size="15" font-weight="700" fill="#b8503c" text-anchor="middle">Baking soda</text><text x="400" y="278" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">NaHCO3</text><text x="400" y="300" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="middle">NaCl+H2O+CO2+NH3</text><text x="400" y="325" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="middle">heat → Na2CO3</text><rect x="540" y="225" width="220" height="120" rx="12" fill="#eef1f6" stroke="#7d94b5" stroke-width="2"/><text x="650" y="255" font-family="sans-serif" font-size="15" font-weight="700" fill="#7d94b5" text-anchor="middle">Bleaching powder</text><text x="650" y="280" font-family="sans-serif" font-size="13" font-weight="600" fill="#3d3833" text-anchor="middle">Cl2 + dry slaked lime</text><text x="650" y="300" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="middle">Ca(ClO)2 (NCERT)</text><text x="650" y="325" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="middle">drinking water germ-free</text><rect x="400" y="380" width="220" height="60" rx="12" fill="#fff" stroke="#b8503c" stroke-width="2"/><text x="510" y="405" font-family="sans-serif" font-size="15" font-weight="700" fill="#b8503c" text-anchor="middle">Washing soda</text><text x="510" y="427" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="middle">Na2CO3.10H2O (recrystallised)</text><line x1="350" y1="177" x2="183.52728915441745" y2="221.39272289215535" stroke="#6f9272" stroke-width="3"/>
  <polygon points="170,225 181.72365060049512,214.6290783149466 185.33092770833977,228.15636746936408" fill="#6f9272"/><line x1="400" y1="177" x2="400" y2="211" stroke="#b8503c" stroke-width="3"/>
  <polygon points="400,225 393,211 407,211" fill="#b8503c"/><line x1="450" y1="177" x2="626.4264512793297" y2="221.57089295477803" stroke="#7d94b5" stroke-width="3"/>
  <polygon points="640,225 624.7118977567187,228.35766731511316 628.1410048019408,214.7841185944429" fill="#7d94b5"/><line x1="455" y1="345" x2="488.9490689567314" y2="371.40483141079113" stroke="#b8503c" stroke-width="3"/>
  <polygon points="500,380 484.65148466212696,376.9302969324254 493.2466532513359,365.8793658891569" fill="#b8503c"/>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.2 · Red Pen</text>
</svg>