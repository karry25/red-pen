  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Reactivity series</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">ek power ranking - 3 zones mein yaad karo</text>
  <rect x="60" y="150" width="50" height="50" rx="10" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="85" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#b8503c" text-anchor="middle">K</text><rect x="113" y="150" width="50" height="50" rx="10" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="138" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#b8503c" text-anchor="middle">Na</text><rect x="166" y="150" width="50" height="50" rx="10" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="191" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#b8503c" text-anchor="middle">Ca</text><rect x="219" y="150" width="50" height="50" rx="10" fill="#fdf3e3" stroke="#c08a2d" stroke-width="2"/><text x="244" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#c08a2d" text-anchor="middle">Mg</text><rect x="272" y="150" width="50" height="50" rx="10" fill="#fdf3e3" stroke="#c08a2d" stroke-width="2"/><text x="297" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#c08a2d" text-anchor="middle">Al</text><rect x="325" y="150" width="50" height="50" rx="10" fill="#fdf3e3" stroke="#c08a2d" stroke-width="2"/><text x="350" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#c08a2d" text-anchor="middle">Zn</text><rect x="378" y="150" width="50" height="50" rx="10" fill="#fdf3e3" stroke="#c08a2d" stroke-width="2"/><text x="403" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#c08a2d" text-anchor="middle">Fe</text><rect x="431" y="150" width="50" height="50" rx="10" fill="#fdf3e3" stroke="#c08a2d" stroke-width="2"/><text x="456" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#c08a2d" text-anchor="middle">Pb</text><rect x="484" y="150" width="50" height="50" rx="10" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="509" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#6f9272" text-anchor="middle">H</text><rect x="537" y="150" width="50" height="50" rx="10" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="562" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#6f9272" text-anchor="middle">Cu</text><rect x="590" y="150" width="50" height="50" rx="10" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="615" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#6f9272" text-anchor="middle">Hg</text><rect x="643" y="150" width="50" height="50" rx="10" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="668" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#6f9272" text-anchor="middle">Ag</text><rect x="696" y="150" width="50" height="50" rx="10" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="721" y="182" font-family="sans-serif" font-size="17" font-weight="700" fill="#6f9272" text-anchor="middle">Au</text><text x="60" y="130" font-family="sans-serif" font-size="14" font-weight="700" fill="#b8503c" text-anchor="start">MOST REACTIVE</text><text x="740" y="130" font-family="sans-serif" font-size="14" font-weight="700" fill="#6f9272" text-anchor="end">LEAST</text><text x="60" y="240" font-family="sans-serif" font-size="14" font-weight="600" fill="#b8503c" text-anchor="start">TOP zone (K-Ca): cold water se react, electrolysis se extract</text><text x="60" y="268" font-family="sans-serif" font-size="14" font-weight="600" fill="#c08a2d" text-anchor="start">MIDDLE (Zn-Pb): steam/acids se react, carbon reduction se extract</text><text x="60" y="296" font-family="sans-serif" font-size="14" font-weight="600" fill="#6f9272" text-anchor="start">BOTTOM (Cu-Au): paani ko bhaav nahi, free state mein milte hain</text><rect x="60" y="330" width="680" height="90" rx="12" fill="#fff" stroke="#7d94b5" stroke-width="2"/><text x="400" y="362" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">Rule: upar wala metal neeche wale ko uske salt solution</text><text x="400" y="388" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">se DISPLACE karta hai. H ke upar = dilute acid se H2 nikalega.</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.3 · Red Pen</text>
