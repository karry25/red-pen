  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Electrolysis of water</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">electrolytic decomposition</text>
  <text x="60" y="130" font-family="sans-serif" font-size="20" font-weight="600" fill="#3d3833" text-anchor="start">2H2O (acidified)</text><line x1="300" y1="122" x2="386" y2="122" stroke="#b8503c" stroke-width="3"/>
  <polygon points="400,122 386,129 386,115" fill="#b8503c"/><text x="320" y="108" font-family="sans-serif" font-size="13" font-weight="600" fill="#c08a2d" text-anchor="middle">electricity</text><text x="420" y="130" font-family="sans-serif" font-size="20" font-weight="700" fill="#b8503c" text-anchor="start">2H2 + O2</text><rect x="60" y="170" width="320" height="200" rx="12" fill="#edf1f7" stroke="#7d94b5" stroke-width="2"/><text x="220" y="200" font-family="sans-serif" font-size="15" font-weight="700" fill="#7d94b5" text-anchor="middle">CATHODE (-)</text><text x="220" y="240" font-family="sans-serif" font-size="22" font-weight="700" fill="#3d3833" text-anchor="middle">H2 gas</text><text x="220" y="270" font-family="sans-serif" font-size="14" font-weight="600" fill="#8b8178" text-anchor="middle">DOUBLE the volume</text><text x="220" y="300" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">pop sound with</text><text x="220" y="318" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">burning splinter</text><rect x="420" y="170" width="320" height="200" rx="12" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="580" y="200" font-family="sans-serif" font-size="15" font-weight="700" fill="#b8503c" text-anchor="middle">ANODE (+)</text><text x="580" y="240" font-family="sans-serif" font-size="22" font-weight="700" fill="#3d3833" text-anchor="middle">O2 gas</text><text x="580" y="270" font-family="sans-serif" font-size="14" font-weight="600" fill="#8b8178" text-anchor="middle">half the volume</text><text x="580" y="300" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">glowing splinter</text><text x="580" y="318" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">re-lights</text><rect x="60" y="400" width="680" height="55" rx="12" fill="#faf3e2" stroke="#c08a2d" stroke-width="2"/><text x="80" y=