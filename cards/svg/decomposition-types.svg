<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Decomposition: 3 types</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">ek reactant tootta hai - kaaran yaad rakho</text>
  <rect x="250" y="115" width="300" height="55" rx="12" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="400" y="148" font-family="sans-serif" font-size="22" font-weight="700" fill="#b8503c" text-anchor="middle">AB → A + B</text><line x1="320" y1="170" x2="163.32022325976175" y2="220.69051600419473" stroke="#b8503c" stroke-width="3"/>
  <polygon points="150,225 161.1654812618591,214.03040437431386 165.4749652576644,227.3506276340756" fill="#b8503c"/><line x1="400" y1="170" x2="400" y2="211" stroke="#b8503c" stroke-width="3"/>
  <polygon points="400,225 393,211 407,211" fill="#b8503c"/><line x1="480" y1="170" x2="636.6797767402383" y2="220.69051600419473" stroke="#b8503c" stroke-width="3"/>
  <polygon points="650,225 634.5250347423356,227.3506276340756 638.8345187381409,214.03040437431386" fill="#b8503c"/><rect x="40" y="230" width="220" height="190" rx="12" fill="#fff" stroke="#c08a2d" stroke-width="2"/><text x="150" y="260" font-family="sans-serif" font-size="16" font-weight="700" fill="#c08a2d" text-anchor="middle">THERMAL</text><text x="150" y="285" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">(heat se)</text><text x="150" y="320" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">CaCO3 →</text><text x="150" y="342" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">CaO + CO2</text><text x="150" y="375" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">2FeSO4 →</text><text x="150" y="397" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">Fe2O3+SO2+SO3</text><rect x="290" y="230" width="220" height="190" rx="12" fill="#fff" stroke="#7d94b5" stroke-width="2"/><text x="400" y="260" font-family="sans-serif" font-size="16" font-weight="700" fill="#7d94b5" text-anchor="middle">ELECTROLYTIC</text><text x="400" y="285" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">(electricity se)</text><text x="400" y="320" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">2H2O →</text><text x="400" y="342" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">2H2 + O2</text><text x="400" y="375" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">acidified water</text><text x="400" y="397" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">(drops of dil. H2SO4)</text><rect x="540" y="230" width="220" height="190" rx="12" fill="#fff" stroke="#6f9272" stroke-width="2"/><text x="650" y="260" font-family="sans-serif" font-size="16" font-weight="700" fill="#6f9272" text-anchor="middle">PHOTOLYTIC</text><text x="650" y="285" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">(light se)</text><text x="650" y="320" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">2AgCl →</text><text x="650" y="342" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">2Ag + Cl2</text><text x="650" y="375" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">2AgBr →</text><text x="650" y="397" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">2Ag + Br2</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.1 · Red Pen</text>
</svg>