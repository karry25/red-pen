  <rect x="40" y="120" width="340" height="150" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="60" y="150" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#6f9272" text-anchor="start">Combination</text><text x="60" y="185" font-family="sans-serif" font-size="22" font-weight="600" fill="#3d3833" text-anchor="start">A + B</text><line x1="180" y1="178" x2="226" y2="178" stroke="#6f9272" stroke-width="3"/>
