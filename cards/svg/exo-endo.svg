<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Exothermic vs endothermic</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">heat nikalti hai ya andar jati hai</text>
  <text x="60" y="130" font-family="sans-serif" font-size="17" font-weight="700" fill="#b8503c" text-anchor="start">EXOTHERMIC (heat out)</text><rect x="60" y="145" width="300" height="40" rx="12" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="210" y="172" font-family="sans-serif" font-size="13" font-weight="600" fill="#3d3833" text-anchor="middle">reactants (high energy)</text><line x1="210" y1="190" x2="210" y2="246" stroke="#b8503c" stroke-width="3"/>
  <polygon points="210,260 203,246 217,246" fill="#b8503c"/><text x="230" y="235" font-family="sans-serif" font-size="13" font-weight="600" fill="#b8503c" text-anchor="start">heat + energy released</text><rect x="60" y="265" width="300" height="40" rx="12" fill="#fff" stroke="#e9dfd0" stroke-width="2"/><text x="210" y="292" font-family="sans-serif" font-size="13" font-weight="600" fill="#3d3833" text-anchor="middle">products (low energy)</text><text x="60" y="340" font-family="sans-serif" font-size="14" font-weight="600" fill="#8b8178" text-anchor="start">burning · respiration · CaO + paani</text><text x="440" y="130" font-family="sans-serif" font-size="17" font-weight="700" fill="#7d94b5" text-anchor="start">ENDOTHERMIC (heat in)</text><rect x="440" y="265" width="300" height="40" rx="12" fill="#edf1f7" stroke="#7d94b5" stroke-width="2"/><text x="590" y="292" font-family="sans-serif" font-size="13" font-weight="600" fill="#3d3833" text-anchor="middle">reactants (low energy)</text><line x1="590" y1="260" x2="590" y2="204" stroke="#7d94b5" stroke-width="3"/>
  <polygon points="590,190 597,204 583,204" fill="#7d94b5"/><text x="608" y="235" font-family="sans-serif" font-size="13" font-weight="600" fill="#7d94b5" text-anchor="start">heat absorbed</text><rect x="440" y="145" width="300" height="40" rx="12" fill="#fff" stroke="#e9dfd0" stroke-width="2"/><text x="590" y="172" font-family="sans-serif" font-size="13" font-weight="600" fill="#3d3833" text-anchor="middle">products (high energy)</text><text x="440" y="340" font-family="sans-serif" font-size="14" font-weight="600" fill="#8b8178" text-anchor="start">CaCO3 ka decomposition · photosynthesis</text><rect x="60" y="380" width="680" height="60" rx="12" fill="#faf3e2" stroke="#c08a2d" stroke-width="2"/><text x="80" y="415" font-family="sans-serif" font-size="16" font-weight="700" fill="#c08a2d" text-anchor="start">Exam tip: "exo" = exit (heat bahar), "endo" = andar (heat andar)</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.1 · Red Pen</text>
</svg>