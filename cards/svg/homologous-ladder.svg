<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Homologous series ladder</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">alkanes: ek family, har member ek CH2 bada</text>
  <rect x="90" y="300" width="150" height="60" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="165" y="328" font-family="sans-serif" font-size="18" font-weight="700" fill="#3d3833" text-anchor="middle">CH4</text><text x="165" y="348" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">methane</text><line x1="240" y1="298" x2="240" y2="299" stroke="#b8503c" stroke-width="3"/>
  <polygon points="240,313 233,299 247,299" fill="#b8503c"/><text x="206" y="274" font-family="sans-serif" font-size="13" font-weight="700" fill="#b8503c" text-anchor="middle">+CH2</text><rect x="220" y="255" width="150" height="60" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="295" y="283" font-family="sans-serif" font-size="18" font-weight="700" fill="#3d3833" text-anchor="middle">C2H6</text><text x="295" y="303" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">ethane</text><line x1="370" y1="253" x2="370" y2="254" stroke="#b8503c" stroke-width="3"/>
  <polygon points="370,268 363,254 377,254" fill="#b8503c"/><text x="336" y="229" font-family="sans-serif" font-size="13" font-weight="700" fill="#b8503c" text-anchor="middle">+CH2</text><rect x="350" y="210" width="150" height="60" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="425" y="238" font-family="sans-serif" font-size="18" font-weight="700" fill="#3d3833" text-anchor="middle">C3H8</text><text x="425" y="258" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">propane</text><line x1="500" y1="208" x2="500" y2="209" stroke="#b8503c" stroke-width="3"/>
  <polygon points="500,223 493,209 507,209" fill="#b8503c"/><text x="466" y="184" font-family="sans-serif" font-size="13" font-weight="700" fill="#b8503c" text-anchor="middle">+CH2</text><rect x="480" y="165" width="150" height="60" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="555" y="193" font-family="sans-serif" font-size="18" font-weight="700" fill="#3d3833" text-anchor="middle">C4H10</text><text x="555" y="213" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">butane</text><line x1="630" y1="163" x2="630" y2="164" stroke="#b8503c" stroke-width="3"/>
  <polygon points="630,178 623,164 637,164" fill="#b8503c"/><text x="596" y="139" font-family="sans-serif" font-size="13" font-weight="700" fill="#b8503c" text-anchor="middle">+CH2</text><rect x="610" y="120" width="150" height="60" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="685" y="148" font-family="sans-serif" font-size="18" font-weight="700" fill="#3d3833" text-anchor="middle">C5H12</text><text x="685" y="168" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">pentane</text><text x="400" y="110" font-family="sans-serif" font-size="16" font-weight="700" fill="#3d3833" text-anchor="middle">har step = +1 carbon, +2 hydrogen = +14 u</text><text x="400" y="445" font-family="sans-serif" font-size="14" font-weight="600" fill="#8b8178" text-anchor="middle">Same general formula · similar chemical properties · gradual physical change</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.4 · Red Pen</text>
</svg>