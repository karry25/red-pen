="180" font-family="sans-serif" font-size="15" font-weight="700" fill="#3d3833" text-anchor="middle">9</text><rect x="520" y="150" width="45" height="46" rx="8" fill="#abcdd0" stroke="#e9dfd0"/><text x="542.5" y="180" font-family="sans-serif" font-size="15" font-weight="700" fill="#3d3833" text-anchor="middle">10</text><rect x="567" y="150" width="45" height="46" rx="8" fill="#9ac2d6" stroke="#e9dfd0"/><text x="589.5" y="180" font-family="sans-serif" font-size="15" font-weight="700" fill="#3d3833" text-anchor="middle">11</text><rect x="614" y="150" width="45" height="46" rx="8" fill="#8db4d8" stroke="#e9dfd0"/><text x="636.5" y="180" font-family="sans-serif" font-size="15" font-weight="700" fill="#3d3833" text-anchor="middle">12</text><rect x="661" y="150" width="45" height="46" rx="8" fill="#87a6d4" stroke="#e9dfd0"/><text x="683.5" y="180" font-family="sans-serif" font-size="15" font-weight="700" fill="#3d3833" text-anchor="middle">13</text><rect x="708" y="150" width="45" height="46" rx="8" fill="#8598cc" stroke="#e9dfd0"/><text x="730.5" y="180" font-family="sans-serif" font-size="15" font-weight="700" fill="#3d3833" text-anchor="middle">14</text><text x="401.5" y="232" font-family="sans-serif" font-size="15" font-weight="700" fill="#6f9272" text-anchor="middle">7 = NEUTRAL (pure water)</text><line x1="285" y1="258" x2="133.5" y2="258" stroke="#b8503c" stroke-width="3"/>
  <polygon points="119.5,258 133.5,251 133.5,265" fill="#b8503c"/><text x="50" y="288" font-family="sans-serif" font-size="15" font-weight="700" fill="#b8503c" text-anchor="start">ACIDIC (zyada H3O+ ions)</text><text x="50" y="313" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="start">lemon juice, vinegar, stomach HCl</text><line x1="473" y1="258" x2="669.5" y2="258" stroke="#7d94b5" stroke-width="3"/>
  <polygon points="683.5,258 669.5,265 669.5,251" fill="#7d94b5"/><text x="473" y="288" font-family="sans-serif" font-size="15" font-weight="700" fill="#7d94b5" text-anchor="start">BASIC (zyada OH- ions)</text><text x="473" y="313" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="start">NaOH solution, soap, baking soda</text><rect x="70" y="350" width="660" height="70" rx="12" fill="#fff" stroke="#c08a2d" stroke-width="2"/><text x="400" y="380" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">YAAD RAKHO: pH ulta chalta hai - jitna ZYADA H3O+,</text><text x="400" y="405" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">utna KAM pH number. (p = potenz = power)</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.2 · Red Pen</text>
