<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Gypsum ↔ Plaster of Paris</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">water of crystallisation in action</text>
  <rect x="60" y="150" width="280" height="130" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="200" y="185" font-family="sans-serif" font-size="20" font-weight="700" fill="#6f9272" text-anchor="middle">GYPSUM</text><text x="200" y="215" font-family="sans-serif" font-size="18" font-weight="600" fill="#3d3833" text-anchor="middle">CaSO4.2H2O</text><text x="200" y="245" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">(2 water molecules)</text><rect x="460" y="150" width="280" height="130" rx="12" fill="#fdf3e3" stroke="#c08a2d" stroke-width="2"/><text x="600" y="185" font-family="sans-serif" font-size="18" font-weight="700" fill="#c08a2d" text-anchor="middle">PLASTER OF PARIS</text><text x="600" y="215" font-family="sans-serif" font-size="18" font-weight="600" fill="#3d3833" text-anchor="middle">CaSO4.½H2O</text><text x="600" y="245" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="middle">(calcium sulphate hemihydrate)</text><line x1="340" y1="195" x2="446" y2="195" stroke="#b8503c" stroke-width="3"/>
  <polygon points="460,195 446,202 446,188" fill="#b8503c"/><text x="400" y="180" font-family="sans-serif" font-size="14" font-weight="700" fill="#b8503c" text-anchor="middle">heat 373 K</text><line x1="460" y1="240" x2="354" y2="240" stroke="#7d94b5" stroke-width="3"/>
  <polygon points="340,240 354,233 354,247" fill="#7d94b5"/><text x="400" y="265" font-family="sans-serif" font-size="14" font-weight="700" fill="#7d94b5" text-anchor="middle">+ 1½ H2O (sets hard)</text><rect x="150" y="330" width="500" height="90" rx="12" fill="#fff" stroke="#e9dfd0" stroke-width="2"/><text x="400" y="362" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">Uses: fractured-bone plaster, toys, moulds,</text><text x="400" y="388" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">smooth surfaces. ½H2O = 2 CaSO4 share 1 water!</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.2 · Red Pen</text>
</svg>