<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Carbon bonding &amp; allotropes</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">share karta hai, transfer nahi</text>
  <rect x="60" y="120" width="320" height="140" rx="12" fill="#fdf3e3" stroke="#c08a2d" stroke-width="2"/><text x="220" y="150" font-family="sans-serif" font-size="16" font-weight="700" fill="#c08a2d" text-anchor="middle">COVALENT BOND</text><text x="220" y="180" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">electron pair SHARE hota hai</text><text x="220" y="205" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">(transfer nahi - wo ionic tha!)</text><text x="220" y="232" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">weak intermolecular forces</text><text x="220" y="248" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">→ low m.p./b.p., poor conductor</text><rect x="420" y="120" width="320" height="140" rx="12" fill="#eef1f6" stroke="#7d94b5" stroke-width="2"/><text x="580" y="150" font-family="sans-serif" font-size="16" font-weight="700" fill="#7d94b5" text-anchor="middle">2 SUPERPOWERS</text><text x="580" y="180" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">Tetravalency: 4 bonds</text><text x="580" y="205" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">Catenation: C khud C se judta hai</text><text x="580" y="235" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">chains · branches · rings</text><rect x="60" y="300" width="320" height="130" rx="12" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="220" y="330" font-family="sans-serif" font-size="16" font-weight="700" fill="#b8503c" text-anchor="middle">DIAMOND</text><text x="220" y="358" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">har C → 4 C se bonded</text><text x="220" y="382" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">rigid 3D network</text><text x="220" y="405" font-family="sans-serif" font-size="14" font-weight="700" fill="#b8503c" text-anchor="middle">= HARDEST substance</text><rect x="420" y="300" width="320" height="130" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="580" y="330" font-family="sans-serif" font-size="16" font-weight="700" fill="#6f9272" text-anchor="middle">GRAPHITE</text><text x="580" y="358" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">har C → 3 C se, hexagonal</text><text x="580" y="382" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">layers SLIDE karte hain</text><text x="580" y="405" font-family="sans-serif" font-size="14" font-weight="700" fill="#6f9272" text-anchor="middle">= slippery + conducts!</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.4 · Red Pen</text>
</svg>