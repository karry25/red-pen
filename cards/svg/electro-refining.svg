<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Electrolytic refining of copper</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">impure → pure, electrolysis se</text>
  <rect x="60" y="150" width="200" height="150" rx="12" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="160" y="185" font-family="sans-serif" font-size="16" font-weight="700" fill="#b8503c" text-anchor="middle">ANODE</text><text x="160" y="215" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">IMPURE copper</text><text x="160" y="245" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">copper dissolves</text><text x="160" y="268" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">into solution</text><rect x="300" y="150" width="200" height="150" rx="12" fill="#eef1f6" stroke="#7d94b5" stroke-width="2"/><text x="400" y="185" font-family="sans-serif" font-size="15" font-weight="700" fill="#7d94b5" text-anchor="middle">ELECTROLYTE</text><text x="400" y="215" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">acidified copper</text><text x="400" y="238" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">sulphate solution</text><rect x="540" y="150" width="200" height="150" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="640" y="185" font-family="sans-serif" font-size="16" font-weight="700" fill="#6f9272" text-anchor="middle">CATHODE</text><text x="640" y="215" font-family="sans-serif" font-size="15" font-weight="600" fill="#3d3833" text-anchor="middle">PURE copper strip</text><text x="640" y="245" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">pure Cu deposits</text><text x="640" y="268" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">here, layer by layer</text><line x1="160" y1="300" x2="160" y2="331" stroke="#b8503c" stroke-width="3"/>
  <polygon points="160,345 153,331 167,331" fill="#b8503c"/><rect x="60" y="345" width="200" height="55" rx="12" fill="#fff" stroke="#b8503c" stroke-width="2"/><text x="160" y="378" font-family="sans-serif" font-size="13" font-weight="700" fill="#b8503c" text-anchor="middle">anode mud (insoluble</text><text x="160" y="396" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b8178" text-anchor="middle">impurities - may hold Ag/Au!)</text><line x1="260" y1="225" x2="286" y2="225" stroke="#7d94b5" stroke-width="3"/>
  <polygon points="300,225 286,232 286,218" fill="#7d94b5"/><line x1="500" y1="225" x2="526" y2="225" stroke="#6f9272" stroke-width="3"/>
  <polygon points="540,225 526,232 526,218" fill="#6f9272"/><text x="400" y="440" font-family="sans-serif" font-size="14" font-weight="600" fill="#3d3833" text-anchor="middle">Cu, Zn, Sn, Ni, Ag, Au - sab aise hi refine hote hain</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.3 · Red Pen</text>
</svg>