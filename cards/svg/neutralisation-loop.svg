<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Neutralisation loop</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">Activity 2.6 - pink, gone, pink again</text>
  <rect x="60" y="130" width="300" height="110" rx="12" fill="#f8ece8" stroke="#b8503c" stroke-width="2"/><text x="210" y="165" font-family="sans-serif" font-size="16" font-weight="600" fill="#3d3833" text-anchor="middle">NaOH + phenolphthalein</text><text x="210" y="195" font-family="sans-serif" font-size="20" font-weight="700" fill="#b8503c" text-anchor="middle">= PINK solution</text><text x="210" y="222" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">(base zyada hai)</text><rect x="440" y="130" width="300" height="110" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="590" y="165" font-family="sans-serif" font-size="16" font-weight="600" fill="#3d3833" text-anchor="middle">+ dilute HCl, drop by drop</text><text x="590" y="195" font-family="sans-serif" font-size="20" font-weight="700" fill="#6f9272" text-anchor="middle">= COLOURLESS</text><text x="590" y="222" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="middle">(exactly neutralised)</text><rect x="250" y="280" width="300" height="100" rx="12" fill="#fdf3e3" stroke="#c08a2d" stroke-width="2"/><text x="400" y="315" font-family="sans-serif" font-size="16" font-weight="600" fill="#3d3833" text-anchor="middle">+ thoda NaOH wapas</text><text x="400" y="345" font-family="sans-serif" font-size="20" font-weight="700" fill="#c08a2d" text-anchor="middle">= PINK AGAIN</text><line x1="360" y1="185" x2="426" y2="185" stroke="#b8503c" stroke-width="3"/>
  <polygon points="440,185 426,192 426,178" fill="#b8503c"/><line x1="500" y1="240" x2="442.1554039897424" y2="273.05405486300435" stroke="#c08a2d" stroke-width="3"/>
  <polygon points="430,280 438.6824314212446,266.9763528681331 445.62837655824023,279.1317568578756" fill="#c08a2d"/><line x1="300" y1="280" x2="242.15540398974244" y2="246.94594513699568" stroke="#b8503c" stroke-width="3"/>
  <polygon points="230,240 245.62837655824026,240.86824314212447 238.68243142124462,253.02364713186688" fill="#b8503c"/><text x="400" y="425" font-family="sans-serif" font-size="17" font-weight="700" fill="#3d3833" text-anchor="middle">NaOH + HCl → NaCl + H2O   (base + acid → salt + water)</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.2 · Red Pen</text>
</svg>