<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fffdf6"/>
  <rect x="16" y="16" width="768" height="468" rx="20" fill="#faf6ec" stroke="#e9dfd0" stroke-width="2"/>
  <text x="40" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#3d3833">Balancing, step by step</text>
  <text x="40" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#b8503c">kabhi formula mat badlo, sirf coefficients</text>
  <rect x="40" y="115" width="720" height="70" rx="12" fill="#fff" stroke="#e9dfd0" stroke-width="2"/><text x="60" y="145" font-family="sans-serif" font-size="18" font-weight="600" fill="#3d3833" text-anchor="start">Goal: har element ke atoms left = right</text><text x="60" y="172" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="start">(law of conservation of mass - atoms na bante, na mitte)</text><rect x="40" y="205" width="720" height="70" rx="12" fill="#fff" stroke="#e9dfd0" stroke-width="2"/><text x="60" y="235" font-family="sans-serif" font-size="18" font-weight="600" fill="#3d3833" text-anchor="start">1. Count atoms both sides:  Fe + H2O → Fe3O4 + H2</text><text x="60" y="262" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="start">Fe: 1 vs 3   O: 1 vs 4   H: 2 vs 2</text><rect x="40" y="295" width="720" height="70" rx="12" fill="#fff" stroke="#e9dfd0" stroke-width="2"/><text x="60" y="325" font-family="sans-serif" font-size="18" font-weight="600" fill="#3d3833" text-anchor="start">2. Fix one element at a time with coefficients</text><text x="60" y="352" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b8178" text-anchor="start">Fe: 3Fe    O: 4H2O    H: 4H2</text><rect x="40" y="385" width="720" height="70" rx="12" fill="#eef4ec" stroke="#6f9272" stroke-width="2"/><text x="60" y="415" font-family="sans-serif" font-size="20" font-weight="700" fill="#6f9272" text-anchor="start">3Fe + 4H2O → Fe3O4 + 4H2</text><text x="60" y="442" font-family="sans-serif" font-size="13" font-weight="600" fill="#6f9272" text-anchor="start">Fe: 3=3   O: 4=4   H: 8=8   balanced!</text>
  <text x="40" y="468" font-family="sans-serif" font-size="12" fill="#8b8178">Source: NCERT Class 10 Science, Ch.1 · Red Pen</text>
</svg>